name: CI

# Activates the release safety net the project already wrote: the full pytest
# suite (incl. the version drift-guard test_served_versions_match_release and
# the C1/C2 security regressions) and the wheel smoke test. Without this, those
# guards only fire when a human remembers to run them locally — which is how
# version drift shipped in v4.9.1, v4.9.2, and nearly v4.9.4.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject promises; 3.13 and 3.14 are what the
        # machines that run Mnemo every day are actually on.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        # --timeout: a flaky suite hang (3.12) used to wedge the runner for
        # hours; now the culprit test fails loudly by name with a stack dump.
        run: pytest tests/ -v --timeout=180 --timeout-method=thread

  # Every MCP client talks to Mnemo through this bridge. Its unit tests need no
  # Mnemo server; test.js is the live integration test and is NOT run here
  # (the *.test.js glob skips it on purpose).
  bridge-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor package.json promises; 22 and 24 are the LTS lines.
        node-version: ["18", "22", "24"]
    defaults:
      run:
        working-directory: integrations/mcp-bridge
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install from lockfile
        run: npm ci
      - name: server.js parses
        run: node --check server.js
      - name: Run bridge unit tests
        run: node --test *.test.js

  # Builds the Claude Desktop one-click bundle from the bridge and starts the
  # built bundle over MCP stdio (initialize + tools/list). `node --check` only
  # proves the bridge parses; this proves the thing people install loads. It
  # also keeps the build recipe honest: the old hand-copied file list fell
  # behind the bridge twice.
  desktop-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build bundle + handshake
        run: bash scripts/build-mcpb.sh "$RUNNER_TEMP/mnemo-cortex.mcpb"

  # robot-install.sh end to end: the real installer in a scratch HOME, the
  # real server started from the unit file it writes, embeddings from a real
  # Ollama. An installer that cannot start its own server fails here, not on
  # a user's machine. The script's mutant case (installer without
  # AGENTB_CONFIG) proves this job can go red.
  robot-install-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ollama:
        # Pinned to the Ollama our own Mnemo host runs every day (0.40.16),
        # so CI tests what production runs; move it when the host moves.
        image: ollama/ollama:0.40.16
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Pull nomic-embed-text into the Ollama service
        run: |
          for i in $(seq 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          curl -sS --fail-with-body http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
      - name: Run robot-install e2e
        env:
          ROBOT_E2E_REQUIRE_OLLAMA: "1"
        run: bash tests/robot-install-e2e.sh

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + install-and-run smoke test
        run: bash scripts/wheel-smoke-test.sh

  # Guards the C3 class of failure: an image that builds but cannot boot
  # because the Dockerfile drifted from the package layout (v4.9.4 shipped a
  # Dockerfile that COPY'd only agentb/ while create_app imports passport.api).
  docker-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mnemo-ci .
      - name: Image boots (imports resolve at module load)
        run: docker run --rm mnemo-ci python -c "import agentb.server; print('boot ok')"
